<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Canvas</title>

<style>
    body {
        background-color: #f2f2f2; 
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        font-family: Arial, sans-serif;
    }

    .container {
        text-align: center;
    }

    canvas {
        border: 1px solid black;
    }
</style>

</head>
<body>
<div class="container">
    <h2>Canvas</h2>
    <canvas id="meucanvas" width="300" height="300"></canvas>
</div>

<script>
    const tela = document.getElementById("meucanvas");
    const ctx = tela.getContext("2d");

    function desenhar_quadrado(x, y, tamanho, cor) {
        ctx.fillStyle = cor;
        ctx.fillRect(x, y, tamanho, tamanho);
    }

    function desenhar_linha(x1, y1, x2, y2, cor) {
        ctx.strokeStyle = cor;
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }

    function arco(x, y, raio, inicio, fim, cor, preenchido=false) {
        ctx.beginPath();
        ctx.arc(x, y, raio, inicio, fim);
        if (preenchido) {
            ctx.fillStyle = cor;
            ctx.fill();
        } else {
            ctx.strokeStyle = cor;
            ctx.stroke();
        }
    }

    function escrever(texto, x, y) {
        ctx.fillStyle = "black";
        ctx.font = "16px Arial";
        ctx.fillText(texto, x, y);
    }

    // --------------------------
    // DESENHO DA FIGURA
    // --------------------------

    // Texto
    escrever("Canvas", 120, 30);

    // Quadrados grandes nos cantos superiores
    desenhar_quadrado(0, 0, 60, "blue");
    desenhar_quadrado(240, 0, 60, "red");

    // Retângulos cyan laterais
    desenhar_quadrado(0, 120, 60, "cyan");
    desenhar_quadrado(240, 120, 60, "cyan");

    // Quadrado central
    desenhar_quadrado(135, 135, 30, "red");

    // Formas inferiores em L
    ctx.fillStyle = "yellow";
    ctx.fillRect(0, 240, 60, 60);
    ctx.fillRect(60, 240, 60, 60);

    ctx.fillStyle = "black";
    ctx.fillRect(240, 240, 60, 60);
    ctx.fillRect(180, 240, 60, 60);

    // Círculo superior
    desenhar_arco(150, 100, 20, 0, 2*Math.PI, "cyan", true);

    // Círculos inferiores
    desenhar_arco(100, 200, 20, 0, 2*Math.PI, "yellow", true);
    desenhar_arco(200, 200, 20, 0, 2*Math.PI, "yellow", true);

    // Semi círculos superiores (verdes)
    desenhar_arco(150, 150, 60, Math.PI, 2*Math.PI, "green");
    desenhar_arco(150, 150, 80, Math.PI, 2*Math.PI, "green");

    // Semi círculos inferiores + um preenchido (cyan)
    desenhar_arco(150, 250, 60, 0, Math.PI, "green");
    desenhar_arco(150, 250, 80, 0, Math.PI, "green");
    desenhar_arco(150, 250, 40, 0, Math.PI, "cyan", true);

    // Linhas diagonais
    desenhar_linha(150, 150, 60, 60, "blue");
    desenhar_linha(150, 150, 240, 60, "red");

    // Linhas centrais
    desenhar_linha(0, 150, 300, 150, "green");
    desenhar_linha(150, 0, 150, 300, "green");

</script>
</body>
</html>
