<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div>
    <h1>Crie seu post</h1>
    <form action="/cadastra" method="POST">
      <p>Título:</p>
      <input type="text" name="titulo" placeholder="Título" required><br>
      <p>Resumo:</p>
      <input type="text" name="resumo" placeholder="Resumo" required><br>
      <p>Conteúdo:</p>
      <input type="text" name="conteudo" placeholder="Conteúdo" required><br>
      <button type="submit">Enviar</button>
    </form>
    <p><a href="/blog">Voltar para posts</a> ></p>
  </div>
</body>
</html>
